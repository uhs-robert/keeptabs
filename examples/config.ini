# ~/.config/keeptabs/config.ini
# Comments start with # or ;, on their own line or after a value.
# Invalid or missing colors use the default.

[colors]
waiting = #FFA0A0
done    = #A3E39A
running = #7FA3C9
idle    = #717A84
# Secondary text in the picker (agent, project, location, age).
muted   = #717A84
